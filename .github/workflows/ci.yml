name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run contract and unit tests
        run: >
          python -m pytest
          tests/contract
          tests/fault
          tests/integration/test_billing_and_idempotency.py
          tests/integration/test_http_providers.py
          -q --tb=short

  compose-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Generate ephemeral signing key
        run: python -c "from bridge.app.core.crypto import CryptoEngine; CryptoEngine()"
      - name: Start compose stack
        run: docker compose -f infra/compose/docker-compose.yml up -d --build
      - name: Run compose E2E tests
        env:
          COMPOSE_E2E: "1"
        run: python -m pytest tests/integration/test_compose_e2e.py -q --tb=short
      - name: Stop compose stack
        if: always()
        run: docker compose -f infra/compose/docker-compose.yml down -v
