name: One-shot signed permit contract

on:
  push:
    branches:
      - fix/signed-permit-contract-20260903
    paths:
      - .github/workflows/cloud_permit_fix_20260903.yml

permissions:
  contents: write

concurrency:
  group: cloud-permit-fix-20260903
  cancel-in-progress: false

jobs:
  patch-test-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract branch
        uses: actions/checkout@v4
        with:
          ref: fix/signed-permit-contract-20260903
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply signed permit contract
        shell: python
        run: |
          import base64
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")

          crypto_path = Path("bridge/app/core/crypto.py")
          replace_once(
              crypto_path,
              """    def verify_payload(self, cert_b64: str, sig_b64: str) -> Tuple[bool, dict, str]:\n""",
              """    def sign_canonical_json(self, payload_dict: dict) -> str:\n        \"\"\"Sign canonical UTF-8 JSON and return base64url without padding.\"\"\"\n        if not self.private_key:\n            raise ValueError(\"Server private key required for signing\")\n        json_bytes = json.dumps(\n            payload_dict,\n            ensure_ascii=False,\n            sort_keys=True,\n            separators=(\",\", \":\"),\n        ).encode(\"utf-8\")\n        raw_sig = self.private_key.sign(json_bytes)\n        return base64.urlsafe_b64encode(raw_sig).rstrip(b\"=\").decode(\"ascii\")\n\n    def verify_payload(self, cert_b64: str, sig_b64: str) -> Tuple[bool, dict, str]:\n""",
              "CryptoEngine.sign_canonical_json",
          )

          contract_path = Path("contracts/entitlement.py")
          replace_once(
              contract_path,
              """    grace_remaining_seconds: int = 0\n""",
              """    grace_remaining_seconds: int = 0\n    permit: Optional[Dict[str, Any]] = None\n""",
              "EntitlementValidationResult.permit",
          )

          main_path = Path("bridge/app/main.py")
          replace_once(
              main_path,
              """from bridge.app.services.event_processor import (\n    BillingEventProcessor,\n    FOSSBillingAdapter,\n    SqliteEventStore,\n)\n""",
              """from bridge.app.services.event_processor import (\n    BillingEventProcessor,\n    FOSSBillingAdapter,\n    SqliteEventStore,\n)\nfrom bridge.app.services.permit_issuer import PermitIssueError, PermitIssuer\n""",
              "main permit issuer import",
          )
          replace_once(
              main_path,
              """crypto_engine = CryptoEngine()\n""",
              """crypto_engine = CryptoEngine()\npermit_issuer = PermitIssuer.from_environment(crypto_engine)\n""",
              "main permit issuer initialization",
          )
          replace_once(
              main_path,
              """class ValidateRequest(BaseModel):\n    license_key: str\n    hardware: Optional[HardwareFingerprint] = None\n""",
              """class PermitRequest(BaseModel):\n    source_sha: str\n    release_manifest_sha256: str\n    release_channel: str\n    mode_id: str\n\n\nclass ValidateRequest(BaseModel):\n    license_key: str\n    hardware: Optional[HardwareFingerprint] = None\n    permit_request: Optional[PermitRequest] = None\n""",
              "ValidateRequest permit context",
          )
          replace_once(
              main_path,
              """@app.post(\"/v1/entitlements/validate\", response_model=EntitlementValidationResult)\nasync def validate_entitlement(req: ValidateRequest):\n    fp = req.hardware.fingerprint if req.hardware else None\n    return await keygen_provider.validate_license(req.license_key, fingerprint=fp)\n""",
              """@app.post(\"/v1/entitlements/validate\", response_model=EntitlementValidationResult)\nasync def validate_entitlement(req: ValidateRequest):\n    fp = req.hardware.fingerprint if req.hardware else None\n    result = await keygen_provider.validate_license(req.license_key, fingerprint=fp)\n    if req.permit_request is None or not result.valid or not result.can_start_runner:\n        return result\n    if req.hardware is None or result.license is None:\n        result.can_start_runner = False\n        result.code = \"PERMIT_CONTEXT_MISSING\"\n        result.message = \"LIVE permit requires an activated device and license context\"\n        return result\n    try:\n        context = req.permit_request\n        result.permit = permit_issuer.issue(\n            license=result.license,\n            hardware=req.hardware,\n            source_sha=context.source_sha,\n            release_manifest_sha256=context.release_manifest_sha256,\n            release_channel=context.release_channel,\n            mode_id=context.mode_id,\n        )\n    except PermitIssueError as exc:\n        result.can_start_runner = False\n        result.code = exc.code\n        result.message = exc.message\n    return result\n""",
              "validate endpoint permit issuance",
          )

          Path("bridge/app/services/permit_issuer.py").write_text(
              base64.b64decode("  CQU9fUEVSTUlUX1NJR05JTkdfS0VZX0lEIikgb3IgIiIpLnN0cmlwKCkKICAgICAgICByYXcgPSBzdHIoc291cmNlLmdldCgiU0hVQUJBT19BUFBST1ZFRF9SRUxFQVN  FU19KU09OIGlzIG5vdCB2YWxpZCBKU09OIgo gICAgICAgICAgICApIGZyb20gZXhjCiAgICAgICAgaWYgbm90IGlzaW5zdGFuY2UocGFyc2VkLCBsaXN0KToKICAgICAgICAgICAgcmFpc2UgUnVudGltZUVycm9yKCJTSFV BQkFPX0FQUFJPVkVEX1JFTEVBU0VTX0pTT04gbXVzdCBiZSBhIEpTT04gbGlzdCIpCiAgICAgICAgdHJ5OgogICAgICAgICAgICBhcHByb3ZhbHMgPSBbQXBwcm92ZWRSZWxlYXNlLmZyb21fbWFwcGluZyhpdGVtKSBmb3IgaXRlbSBpbiBwYXJzZWRdCiAgICAgICAgZXhjZXB0IChBdHRyaWJ1dGVFcnJvciwgUGVybWl0SXNzdW   ").decode("utf-8"),
              encoding="utf-8",
              newline="\n",
          )
          Path("tests/contract/test_signed_permit.py").write_text(
              base64.b64decode(" ").decode("utf-8"),
              encoding="utf-8",
              newline="\n",
          )

      - name: Run permit contract tests
        run: |
          pytest -q tests/contract/test_signed_permit.py
          pytest -q tests/contract tests/fault tests/integration/test_billing_and_idempotency.py tests/integration/test_http_providers.py
          git diff --check

      - name: Commit verified server contract
        run: |
          git config user.name "OpenAI Cloud Fix"
          git config user.email "openai-cloud-fix@users.noreply.github.com"
          git rm .github/workflows/cloud_permit_fix_20260903.yml
          git add bridge/app/core/crypto.py bridge/app/main.py bridge/app/services/permit_issuer.py contracts/entitlement.py tests/contract/test_signed_permit.py
          git diff --cached --check
          git commit -m "feat(subscription): issue permits for approved release identities"
          git push origin HEAD:fix/signed-permit-contract-20260903
