name: shuashuabao-subscription-production

services:
  bridge:
    build:
      context: ../..
      dockerfile: bridge/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      PROVIDER_MODE: production
      SUBSCRIPTION_DB_PATH: /data/subscription_state.db
      SIGNING_KEY_PATH: /run/secrets/signing_key.pem
    volumes:
      - subscription-data:/data
      - ./secrets/signing_key.pem:/run/secrets/signing_key.pem:ro
    command:
      - sh
      - -c
      - >-
        python -m bridge.app.production_guard &&
        exec uvicorn bridge.app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - private

volumes:
  subscription-data:

networks:
  private:
    driver: bridge
