services:
  bridge:
    build:
      context: ../..
      dockerfile: bridge/Dockerfile
    container_name: shuashuabao-bridge
    ports:
      - "8000:8000"
    environment:
      - PROVIDER_MODE=keygen
      - PORT=8000
      - KEYGEN_BASE_URL=http://keygen:3000
      - KEYGEN_ACCOUNT_ID=${KEYGEN_ACCOUNT_ID:-00000000-0000-0000-0000-000000000000}
      - KEYGEN_TOKEN=${KEYGEN_TOKEN:-changeme}
      - KEYGATE_BASE_URL=http://keygate:8080
      - KEYGATE_TOKEN=${KEYGATE_TOKEN:-changeme}
      - FOSSBILLING_WEBHOOK_SECRET=${FOSSBILLING_WEBHOOK_SECRET:-changeme_webhook_secret_32chars}
      - SIGNING_KEY_PATH=/run/secrets/signing_key.pem
      - SUBSCRIPTION_DB_PATH=/data/subscription_state.db
      - BRIDGE_ED25519_PRIVATE_KEY_FILE=/run/secrets/ed25519_private_key
    volumes:
      - ../../signing_key.pem:/run/secrets/signing_key.pem:ro
      - subscription-data:/data
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
      keygen:
        condition: service_started
      keygate:
        condition: service_started
    networks:
      - subscription

  keygen:
    build:
      context: ../../upstreams/keygen
      dockerfile: Dockerfile
    container_name: shuashuabao-keygen
    ports:
      - "3000:3000"
    environment:
      - SECRET_KEY=${KEYGEN_SECRET_KEY:-changeme-secret-key-at-least-32-chars!!}
      - ENCRYPTION_DETERMINISTIC_KEY=${KEYGEN_ENC_DET_KEY:-changeme-det-key-32-chars-pad!!}
      - ENCRYPTION_PRIMARY_KEY=${KEYGEN_ENC_PRIMARY_KEY:-changeme-primary-key-at-32chars!}
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/keygen?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - PORT=3000
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - subscription

  keygate:
    build:
      context: ../../upstreams/keygate
      dockerfile: Dockerfile
    container_name: shuashuabao-keygate
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_DSN=postgres://postgres:postgres@postgres:5432/keygate?sslmode=disable
    depends_on:
      postgres:
        condition: service_started
    networks:
      - subscription

  fossbilling:
    image: fossbilling/fossbilling:0.6.20
    container_name: shuashuabao-fossbilling
    ports:
      - "8088:80"
    environment:
      - DB_TYPE=mysql
      - DB_HOST=mariadb
      - DB_NAME=fossbilling
      - DB_USER=fossbilling
      - DB_PASSWORD=fossbilling_pass
      - FOSSBILLING_WEBHOOK_SECRET=${FOSSBILLING_WEBHOOK_SECRET:-changeme_webhook_secret_32chars}
    depends_on:
      mariadb:
        condition: service_started
    networks:
      - subscription

  postgres:
    image: postgres:16-alpine
    container_name: shuashuabao-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    networks:
      - subscription

  mariadb:
    image: mariadb:10.11
    container_name: shuashuabao-mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=root_pass
      - MYSQL_DATABASE=fossbilling
      - MYSQL_USER=fossbilling
      - MYSQL_PASSWORD=fossbilling_pass
    ports:
      - "3306:3306"
    networks:
      - subscription

  redis:
    image: redis:7-alpine
    container_name: shuashuabao-redis
    ports:
      - "6379:6379"
    networks:
      - subscription

volumes:
  postgres-data:
  subscription-data:

networks:
  subscription:
